name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group:
    ${{ github.event_name != 'merge_group' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  #v7.0.0

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  #v7.0.0
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Compile contract
        run: yarn compile

      - name: Start local Midnight network
        run: yarn env:up

      - name: Wait for DUST to accrue
        run: npx vite-node scripts/wait-for-dust.ts

      - name: Run tests against local network
        run: yarn test:local

      # Must run before env:down, which deletes the containers and their logs.
      - name: Capture service logs
        if: always()
        run: |
          mkdir -p logs/docker
          docker compose ps --all
          for svc in $(docker compose config --services); do
            docker compose logs --no-color --timestamps "$svc" \
              > "logs/docker/$svc.log" 2>&1 || true
          done
          # Surface dead services inline so the job log alone explains the failure.
          docker compose ps --all --format '{{.Service}} {{.State}} {{.ExitCode}}' \
            | while read -r svc state code; do
              [ "$state" = running ] && [ "$code" = 0 ] && continue
              echo "::group::$svc ($state, exit $code) - last 50 lines"
              tail -n 50 "logs/docker/$svc.log" || true
              echo "::endgroup::"
            done

      - name: Stop local Midnight network
        if: always()
        run: yarn env:down

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          name: docker-compose-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 7
